<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Пройди по лиане! — клетки 29-31</title>
<style>
  :root{
    --accent:#DFCCA4;
    --bg1:#0f172a;
    --bg2:#1e293b;
    --path:#5a6a4f;
    --corridor:rgba(223,204,164,.08);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; height:100%; overflow:hidden;
    font-family:'Trebuchet MS','Segoe UI',sans-serif;
    background: radial-gradient(circle at 50% 0%, var(--bg2), var(--bg1));
    touch-action:none;
    user-select:none;
    color:#fff;
  }
  #game{
    position:relative;
    width:100%;
    height:100dvh;
    display:flex;
    flex-direction:column;
    align-items:center;
    overflow:hidden;
  }
  h1{
    font-size:26px;
    margin:14px 0 4px;
    color:var(--accent);
    text-shadow:0 3px 10px rgba(0,0,0,.5);
    text-align:center;
    z-index:5;
  }
  #hint{
    font-size:14px;
    opacity:.7;
    margin-bottom:6px;
    z-index:5;
    text-align:center;
    padding:0 20px;
  }
  #progressBar{
    width:80%;
    max-width:280px;
    height:10px;
    background:rgba(255,255,255,.12);
    border-radius:6px;
    overflow:hidden;
    margin-bottom:8px;
    z-index:5;
  }
  #progressFill{
    height:100%;
    width:0%;
    background:var(--accent);
    transition: width .15s ease-out;
  }
  #canvasWrap{
    position:relative;
    flex:1;
    width:100%;
    display:flex;
    justify-content:center;
  }
  canvas{
    touch-action:none;
    display:block;
  }
  #resultOverlay{
    position:absolute; inset:0;
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:16px;
    background:rgba(15,23,42,.95);
    z-index:20;
    text-align:center;
    padding:20px;
  }
  #resultEmoji{ font-size:70px; }
  #resultText{
    font-size:24px;
    font-weight:bold;
    color:var(--accent);
    max-width:280px;
  }
  button{
    font-size:19px;
    font-weight:bold;
    padding:13px 34px;
    border:none;
    border-radius:30px;
    background:var(--accent);
    color:#000;
    box-shadow:0 6px 20px rgba(223,204,164,.35);
    cursor:pointer;
  }
  button:active{ transform:scale(0.96); }
  #offTrackFlash{
    position:absolute;
    inset:0;
    background:rgba(255,100,100,0);
    pointer-events:none;
    z-index:15;
    transition: background .15s;
  }
</style>
</head>
<body>
<div id="game">
  <h1>Пройди по лиане!</h1>
  <div id="hint">Помоги фламинго добраться до финиша, веди пальцем до самого низа, не отрываясь от дорожки</div>
  <div id="progressBar"><div id="progressFill"></div></div>

  <div id="canvasWrap">
    <canvas id="track"></canvas>
    <div id="offTrackFlash"></div>
  </div>

  <div id="resultOverlay">
    <div id="resultEmoji">🎉</div>
    <div id="resultText">Ты прошёл лиану!</div>
    <button onclick="resetGame()">Ещё раз</button>
  </div>
</div>

function resizeCanvas(){
  W = wrap.clientWidth;
  H = wrap.clientHeight;
  canvas.width = W;
  canvas.height = H;
  buildPath();
  draw();
}

function buildPath(){
  pathPoints = [];
  const margin = 60;
  const topY = 40;
  const bottomY = H - 40;
  const amplitude = Math.min(W * 0.28, 90);
  const cycles = 2.5;
  const steps = 400;
  for(let i=0;i<=steps;i++){
    const t = i/steps;
    const y = topY + t * (bottomY - topY);
    const x = W/2 + Math.sin(t * Math.PI * 2 * cycles) * amplitude;
    pathPoints.push({x, y});
  }
}

function draw(){
  ctx.clearRect(0,0,W,H);

  // corridor (tolerance zone) as soft shading
  ctx.beginPath();
  pathPoints.forEach((p,i) => { i===0 ? ctx.moveTo(p.x,p.y) : ctx.lineTo(p.x,p.y); });
  ctx.strokeStyle = 'rgba(223,204,164,.07)';
  ctx.lineWidth = TOLERANCE*2;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.stroke();

  // guide dashed line (remaining, greyish)
  ctx.beginPath();
  pathPoints.forEach((p,i) => { i===0 ? ctx.moveTo(p.x,p.y) : ctx.lineTo(p.x,p.y); });
  ctx.setLineDash([10,10]);
  ctx.strokeStyle = 'rgba(255,255,255,.25)';
  ctx.lineWidth = 3;
  ctx.stroke();
  ctx.setLineDash([]);

  // completed portion (solid accent)
  if(maxIndexReached > 0){
    ctx.beginPath();
    for(let i=0;i<=maxIndexReached;i++){
      const p = pathPoints[i];
      i===0 ? ctx.moveTo(p.x,p.y) : ctx.lineTo(p.x,p.y);
    }
    ctx.strokeStyle = '#DFCCA4';
    ctx.lineWidth = 6;
    ctx.lineCap = 'round';
    ctx.stroke();
  }

  // finish flag
  ctx.font = '34px sans-serif';
  ctx.textAlign = 'center';
  const last = pathPoints[pathPoints.length-1];
  ctx.fillText('🏁', last.x, last.y + 34);

  // flamingo marker at current progress (or at start if not moved yet)
  const cur = pathPoints[maxIndexReached];
  if(!finished){
    const size = 56;
    if(flamingoLoaded){
      ctx.drawImage(flamingoImg, cur.x - size/2, cur.y - size + 6, size, size);
    } else {
      ctx.beginPath();
      ctx.arc(cur.x, cur.y, 12, 0, Math.PI*2);
      ctx.fillStyle = '#DFCCA4';
      ctx.fill();
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 2;
      ctx.stroke();
    }
  }
}

function distToPoint(px,py, p){
  const dx = px - p.x, dy = py - p.y;
  return Math.sqrt(dx*dx + dy*dy);
}

function findNearestForwardIndex(px, py){
  // search a window forward/back from current progress for efficiency
  const searchStart = Math.max(0, maxIndexReached - 15);
  const searchEnd = Math.min(pathPoints.length - 1, maxIndexReached + 40);
  let bestIdx = -1;
  let bestDist = Infinity;
  for(let i=searchStart; i<=searchEnd; i++){
    const d = distToPoint(px,py, pathPoints[i]);
    if(d < bestDist){
      bestDist = d;
      bestIdx = i;
    }
  }
  return { idx: bestIdx, dist: bestDist };
}

function handlePointer(clientX, clientY){
  if(finished) return;
  const rect = canvas.getBoundingClientRect();
  const px = clientX - rect.left;
  const py = clientY - rect.top;

  const { idx, dist } = findNearestForwardIndex(px, py);

  if(dist <= TOLERANCE){
    if(idx > maxIndexReached) maxIndexReached = idx;
    offTrackFlash.style.background = 'rgba(255,100,100,0)';
    updateProgress();
    draw();
    if(maxIndexReached >= pathPoints.length - 2){
      finishGame();
    }
  } else {
    // off track - gentle flash, no progress lost
    offTrackFlash.style.background = 'rgba(255,100,100,.12)';
    setTimeout(() => { offTrackFlash.style.background = 'rgba(255,100,100,0)'; }, 150);
  }
}

function updateProgress(){
  const pct = Math.round((maxIndexReached / (pathPoints.length-1)) * 100);
  progressFill.style.width = pct + '%';
}

let audioCtx;
function playChime(){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    [660, 880, 1100].forEach((freq, i) => {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(freq, audioCtx.currentTime + i*0.1);
      g.gain.setValueAtTime(0.2, audioCtx.currentTime + i*0.1);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + i*0.1 + 0.25);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(audioCtx.currentTime + i*0.1);
      o.stop(audioCtx.currentTime + i*0.1 + 0.25);
    });
  }catch(e){}
}

function finishGame(){
  finished = true;
  playChime();
  progressFill.style.width = '100%';
  setTimeout(() => {
    resultOverlay.style.display = 'flex';
  }, 300);
}

function resetGame(){
  maxIndexReached = 0;
  finished = false;
  progressFill.style.width = '0%';
  resultOverlay.style.display = 'none';
  draw();
}

canvas.addEventListener('pointerdown', (e) => {
  dragging = true;
  handlePointer(e.clientX, e.clientY);
});
canvas.addEventListener('pointermove', (e) => {
  if(!dragging) return;
  handlePointer(e.clientX, e.clientY);
});
window.addEventListener('pointerup', () => { dragging = false; });
window.addEventListener('pointercancel', () => { dragging = false; });

window.addEventListener('resize', resizeCanvas);
resizeCanvas();
</script>
