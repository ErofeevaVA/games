<title>Всё по местам — развивающая игра для детей</title>

<style>
:root{
  --background:oklch(.97 .03 95);--foreground:oklch(.30 .06 260);--card:#fff;
  --primary:oklch(.72 .18 45);--primary-deep:oklch(.58 .17 40);
  --secondary:oklch(.85 .10 220);--muted:oklch(.94 .03 95);
  --muted-foreground:oklch(.50 .05 260);--success:oklch(.70 .18 145);
  --sun:oklch(.88 .17 90);
  --shadow-card:0 10px 30px -12px oklch(.30 .06 260 / .35);
  --shadow-lift:0 18px 30px -10px oklch(.30 .06 260 / .45);
  --shadow-button:0 6px 0 var(--primary-deep),0 12px 24px -8px oklch(.60 .17 40 / .6);
  --gradient-sky:linear-gradient(180deg,oklch(.90 .08 220) 0%,oklch(.96 .05 120) 60%,oklch(.97 .03 95) 100%);
  --gradient-button:linear-gradient(180deg,oklch(.78 .17 55),oklch(.68 .19 40));
}
*{box-sizing:border-box}
html{overflow-x:hidden;min-height:100%}
body{margin:0;min-height:100dvh;overflow-x:hidden;background:var(--gradient-sky);background-attachment:fixed;color:var(--foreground);font-family:Nunito,ui-rounded,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:inherit;cursor:pointer}img{max-width:100%}
.display{font-family:Fredoka,ui-rounded,system-ui,sans-serif}
.safe-pad{padding:max(8px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
body.in-iframe .safe-pad{padding-top:max(68px,env(safe-area-inset-top))}
.icon-btn{display:grid;place-items:center;width:48px;height:48px;flex:0 0 48px;border:0;border-radius:999px;background:var(--card);box-shadow:var(--shadow-card);transition:transform .15s}.icon-btn:active{transform:scale(.95)}.icon-btn svg{width:24px;height:24px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.candy-btn{background:var(--gradient-button);border:0;border-radius:999px;color:white;font-family:Fredoka,ui-rounded,system-ui,sans-serif;font-size:30px;font-weight:600;box-shadow:var(--shadow-button);padding:14px 56px;min-height:64px;transition:transform .12s,box-shadow .12s}.candy-btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--primary-deep)}
.start-screen{max-width:1024px;min-height:100dvh;margin:auto;display:flex;align-items:center;flex-direction:column;gap:22px;text-align:center}.start-head{width:100%;display:flex;justify-content:flex-end}.start-screen h1{margin:0;color:var(--primary);font-family:Fredoka,ui-rounded,system-ui,sans-serif;font-size:clamp(44px,7vw,72px);font-weight:700;text-shadow:0 2px 2px #ffffff90}.start-screen .subtitle{margin:9px 0 0;font-size:clamp(18px,2.5vw,24px);font-weight:800}.start-hero{width:100%;max-height:50dvh;object-fit:cover;border:4px solid white;border-radius:32px;box-shadow:var(--shadow-lift)}.progress-text{color:var(--muted-foreground);font-family:Fredoka,ui-rounded,system-ui,sans-serif;font-weight:600;font-size:18px}.reset{background:none;border:0;text-decoration:underline;color:var(--muted-foreground);font-weight:800;padding:10px}
.game-screen{max-width:1400px;margin:auto;min-height:100dvh;display:flex;flex-direction:column;gap:12px}.game-top{display:flex;align-items:center;justify-content:space-between;gap:8px}.game-top h1{font-family:Fredoka,ui-rounded,system-ui,sans-serif;font-size:clamp(20px,3vw,30px);font-weight:600;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}.top-right{display:flex;align-items:center;gap:8px}.counter{height:48px;display:flex;align-items:center;gap:4px;padding:0 15px;border-radius:999px;background:white;box-shadow:var(--shadow-card);font-family:Fredoka,ui-rounded,system-ui,sans-serif;font-size:20px;font-weight:600;white-space:nowrap}.counter .good{color:var(--success)}.counter .total{color:var(--muted-foreground)}
.scenes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;width:100%;max-width:min(100%,calc((100dvh - 280px) * 2.9));margin:0 auto}
.scene{position:relative;width:100%;aspect-ratio:10/7;border:4px solid white;border-radius:24px;box-shadow:var(--shadow-card);padding:0;overflow:hidden;background:var(--muted);transition:transform .2s,box-shadow .2s;touch-action:pan-y;display:block}.scene img.background{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}.scene.highlight{outline:8px solid var(--sun);transform:scale(1.02)}.scene.selected-target{outline:4px solid #f8d449ad}.scene-name{position:absolute;top:12px;left:50%;transform:translateX(-50%);padding:4px 18px;border-radius:100px;white-space:nowrap;background:#ffffffeb;box-shadow:var(--shadow-card);font-family:Fredoka,ui-rounded,system-ui,sans-serif;font-size:clamp(17px,2vw,24px);font-weight:600;pointer-events:none}
.scene-slot{position:absolute;aspect-ratio:1;transform:translate(-50%,-50%);pointer-events:none}.scene-slot img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 4px 5px #0003)}.placed-pop{animation:pop-in .5s cubic-bezier(.3,1.5,.6,1) both}.placed-check{position:absolute;right:-6px;top:-6px;background:var(--success);color:#fff;border-radius:100px;font-size:16px;font-weight:800;width:26px;height:26px;display:grid;place-items:center;box-shadow:var(--shadow-card)}
.hint{text-align:center;font-size:clamp(14px,1.5vw,16px);font-weight:800;color:var(--muted-foreground);margin:0}
.tray{display:flex;justify-content:center;flex-wrap:wrap;align-items:flex-start;gap:12px;padding:12px;background:#ffffffb8;box-shadow:var(--shadow-card);border-radius:24px;max-width:896px;width:100%;margin:0 auto}.item{touch-action:none;user-select:none;-webkit-user-select:none;display:flex;flex-direction:column;align-items:center;width:18%;min-width:60px;max-width:110px;padding:8px;border:0;border-radius:16px;background:#fff;box-shadow:var(--shadow-card);transition:transform .2s,box-shadow .2s}.item:hover{transform:translateY(-2px)}.item.is-selected{transform:translateY(-4px) scale(1.1);outline:4px solid var(--sun);box-shadow:var(--shadow-lift)}.item.is-hidden{opacity:0;pointer-events:none}.item img{width:100%;aspect-ratio:1;object-fit:contain;pointer-events:none}.item-label{font-size:clamp(11px,1.4vw,14px);line-height:1.2;font-weight:800;margin-top:2px;text-align:center;pointer-events:none;word-break:break-word}
.drag-ghost,.flight{position:fixed;z-index:55;pointer-events:none;object-fit:contain;filter:drop-shadow(0 6px 9px #0005)}.toast{position:fixed;z-index:70;bottom:30%;left:50%;transform:translateX(-50%);white-space:nowrap;padding:12px 24px;background:white;border-radius:100px;box-shadow:var(--shadow-lift);font-family:Fredoka,ui-rounded,system-ui,sans-serif;font-size:20px;font-weight:600;animation:toast-in .25s ease-out both}
.win-overlay{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:16px;background:#33404e5c;backdrop-filter:blur(2px)}.win-modal{position:relative;background:white;border-radius:32px;box-shadow:var(--shadow-lift);padding:32px;text-align:center;width:min(100%,450px);animation:pop-in .5s cubic-bezier(.3,1.5,.6,1) both}.win-modal .emoji{font-size:68px;animation:float-title 3s ease-in-out infinite}.win-modal h2{margin:8px 0;font-family:Fredoka,ui-rounded,system-ui,sans-serif;font-size:clamp(26px,4vw,36px);font-weight:600}.win-modal p{font-size:20px;font-weight:800;color:var(--muted-foreground)}.win-modal .candy-btn{font-size:23px;width:100%;min-height:56px;padding:12px 15px}.confetti{position:absolute;top:-15vh;z-index:1;pointer-events:none;animation:confetti var(--dur) linear var(--delay) forwards}
.finish-screen{min-height:100dvh;display:grid;place-items:center}.finish-modal{background:white;border-radius:32px;box-shadow:var(--shadow-lift);padding:32px;text-align:center;max-width:450px}.finish-modal h1{font-family:Fredoka,ui-rounded,system-ui,sans-serif;font-size:35px}.finish-modal .candy-btn{font-size:22px;width:100%;padding:12px}.finish-modal .reset{display:block;margin:10px auto}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-4%) rotate(2deg)}}@keyframes swim{0%,100%{transform:translateX(-6%) scaleX(1)}49%{transform:translateX(6%) scaleX(1)}50%{transform:translateX(6%) scaleX(-1)}99%{transform:translateX(-6%) scaleX(-1)}}@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}@keyframes hop{0%,80%,100%{transform:translateY(0)}88%{transform:translateY(-12%)}}@keyframes pop-in{0%{transform:scale(.2);opacity:0}70%{transform:scale(1.15);opacity:1}100%{transform:scale(1)}}@keyframes float-title{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}@keyframes toast-in{0%{transform:translate(-50%,10px);opacity:0}100%{transform:translate(-50%,0);opacity:1}}@keyframes confetti{from{transform:translate3d(0,-10vh,0) rotate(0)}to{transform:translate3d(var(--drift),110vh,0) rotate(720deg)}}
.ambient-bob{animation:bob 3.2s ease-in-out infinite;transform-origin:50% 80%}.ambient-swim{animation:swim 7s linear infinite}.ambient-sway{animation:sway 2.8s ease-in-out infinite;transform-origin:50% 100%}.ambient-hop{animation:hop 3.5s ease-in-out infinite}
@media(max-width:767px){.scenes{grid-template-columns:1fr;gap:8px;max-width:100%}.scene{aspect-ratio:16/9;border-radius:24px}.game-screen{gap:8px}.tray{gap:8px;padding:8px}.item{padding:4px}.game-top h1{font-size:19px}.counter{padding:0 10px}.scene-name{top:8px}.start-screen{gap:16px}.start-hero{max-height:50dvh}.start-screen h1{font-size:clamp(36px,8vw,52px)}.candy-btn{padding:12px 35px}.item-label{font-size:11px}}
@media(max-width:365px){.counter{font-size:16px;padding:0 8px}.game-top h1{font-size:16px}.icon-btn{height:44px;width:44px;flex-basis:44px}.scene-name{font-size:16px}.item{min-width:48px}}
@media(prefers-reduced-motion:reduce){.ambient-bob,.ambient-swim,.ambient-sway,.ambient-hop,.win-modal .emoji{animation:none}.confetti{display:none}}
</style>
</head>

<script>
(() => {
'use strict';
if (window.parent !== window) document.body.classList.add('in-iframe');
const app = document.getElementById('app');
const PROGRESS_KEY = 'vpm:completed', MUTE_KEY='vpm:muted';
const svgHome='<svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>';
const svgSound='<svg viewBox="0 0 24 24"><path d="m11 5-5 5H3v4h3l5 5V5z"/><path d="M15 9a5 5 0 0 1 0 6m3-9a9 9 0 0 1 0 12"/></svg>';
const svgMute='<svg viewBox="0 0 24 24"><path d="m11 5-5 5H3v4h3l5 5V5zM16 9l5 6m0-6-5 6"/></svg>';
const esc = v => String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle = a => {const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};
const readDone = () => {try{return JSON.parse(localStorage.getItem(PROGRESS_KEY)||'[]')}catch{return []}};
const readMute=()=>{try{return localStorage.getItem(MUTE_KEY)==='1'}catch{return false}};
let muted=readMute(), audioCtx=null, sets=[], currentIdx=-1, currentSet=null, placed=new Set(), ordered=[], selected=null, drag=null, busy=new Set(), animating=0, won=false;
// Оригинальные звуки Lovable: game/sound.ts (Web Audio, без MP3).
let audioPrimed=false, audioActive=0;
function unlockSound(){
  try{
    // На iOS доступно воспроизведение после первого пользовательского жеста.
    if(navigator.audioSession)navigator.audioSession.type='playback';
    if(!audioCtx){const A=window.AudioContext||window.webkitAudioContext;if(!A)return;audioCtx=new A()}
    if(audioCtx.state!=='running')audioCtx.resume().catch(()=>{});
    if(!audioPrimed){
      const b=audioCtx.createBuffer(1,1,22050),src=audioCtx.createBufferSource();
      src.buffer=b;src.connect(audioCtx.destination);src.start(0);audioPrimed=true;
    }
  }catch{}
}
// Разблокировка звука при первом касании / клике для мобильных браузеров.
['pointerdown','touchstart','touchend','click','keydown'].forEach(ev=>
  window.addEventListener(ev,unlockSound,{capture:true,passive:true})
);
function tone(freq,start,dur,type='sine',vol=.2,slideTo){
  if(!audioCtx||audioActive>12)return;
  try{
    const t=audioCtx.currentTime+start,o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.type=type;o.frequency.setValueAtTime(freq,t);
    if(slideTo)o.frequency.exponentialRampToValueAtTime(slideTo,t+dur);
    g.gain.setValueAtTime(.0001,t);
    g.gain.exponentialRampToValueAtTime(vol,t+.01);
    g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g).connect(audioCtx.destination);
    audioActive++;o.onended=()=>{audioActive=Math.max(0,audioActive-1)};
    o.start(t);o.stop(t+dur+.02);
  }catch{}
}
function playNow(name){
  switch(name){
    case 'pop':tone(500,0,.09,'sine',.18,900);break;
    case 'place':tone(220,0,.12,'triangle',.12,160);break;
    case 'wrong':tone(330,0,.18,'sine',.1,260);tone(260,.12,.22,'sine',.08,220);break;
    case 'correct':[1047,1319,1568].forEach((f,i)=>tone(f,i*.07,.35,'sine',.12));break;
    case 'win':{
      const notes=[523,659,784,659,784,1047,988,1047];
      notes.forEach((f,i)=>tone(f,i*.22,.3,'triangle',.14));
      tone(1568,notes.length*.22,.6,'sine',.1);
      break;
    }
  }
}
function sound(name){
  if(muted)return;
  unlockSound();
  if(!audioCtx||audioActive>12)return;
  try{
    if(audioCtx.state!=='running')audioCtx.resume().then(()=>playNow(name)).catch(()=>{});
    else playNow(name);
  }catch{}
}
function soundButton(){return `<button class="icon-btn sound-toggle" type="button" aria-label="${muted?'Включить звук':'Выключить звук'}">${muted?svgMute:svgSound}</button>`}
function setupSound(){document.querySelectorAll('.sound-toggle').forEach(b=>b.addEventListener('click',()=>{unlockSound();muted=!muted;try{localStorage.setItem(MUTE_KEY,muted?'1':'0')}catch{};document.querySelectorAll('.sound-toggle').forEach(x=>{x.innerHTML=muted?svgMute:svgSound;x.setAttribute('aria-label',muted?'Включить звук':'Выключить звук')});if(!muted)sound('pop')}))}
function routeHome(){cleanupDrag();currentIdx=-1;currentSet=null;const done=readDone();app.innerHTML=`<main class="safe-pad start-screen"><div class="start-head">${soundButton()}</div><div><h1>Всё по местам 🏡</h1><p class="subtitle">Помоги каждому предмету найти своё место!</p></div><img class="start-hero" src="assets/hero.webp" alt="Сказочная долина с огородом, домиком и озером"><button class="candy-btn start" type="button">Играть</button><p class="progress-text">${Math.min(done.length,sets.length)} из ${sets.length} приключений</p>${done.length?'<button class="reset" type="button">Начать заново</button>':''}</main>`;
 app.querySelector('.start').onclick=()=>{unlockSound();sound('pop');let i=sets.findIndex(s=>!done.includes(s.id));startGame(i<0?0:i)};
 if(done.length)app.querySelector('.reset').onclick=()=>{localStorage.removeItem(PROGRESS_KEY);routeHome()};setupSound();}
function startGame(i){cleanupDrag();currentIdx=i;currentSet=sets[i]||null;if(!currentSet){renderFinish();return}placed=new Set();selected=null;busy=new Set();animating=0;won=false;ordered=shuffle(currentSet.items);renderGame();window.scrollTo({top:0,behavior:'instant'});const next=sets[i+1];if(next)setTimeout(()=>[...next.locations.map(l=>l.image),...next.items.map(it=>it.image)].forEach(src=>{const im=new Image();im.src=src}),1500)}
function sceneTemplate(loc){let slots=currentSet.items.filter(it=>it.locationId===loc.id).map(it=>`<span class="scene-slot" data-slot="${esc(it.id)}" style="left:${it.slot.x}%;top:${it.slot.y}%;width:${it.slot.size}%"></span>`).join('');return `<button type="button" class="scene" data-loc="${esc(loc.id)}" aria-label="Локация ${esc(loc.name)}"><img class="background" src="${esc(loc.image)}" alt="${esc(loc.name)}"><span class="scene-name">${esc(loc.name)}</span>${slots}</button>`}
function itemTemplate(it){return `<button class="item" data-item="${esc(it.id)}" type="button" aria-label="${esc(it.name)}" aria-pressed="false"><img data-item-img src="${esc(it.image)}" alt="" draggable="false"><span class="item-label">${esc(it.name)}</span></button>`}
function renderGame(){const s=currentSet;app.innerHTML=`<main class="safe-pad game-screen"><header class="game-top"><button class="icon-btn home" type="button" aria-label="На главную">${svgHome}</button><h1>${esc(s.title)}</h1><div class="top-right"><div class="counter display" aria-live="polite"><span class="good count">0</span><span class="total">/ ${s.items.length}</span></div>${soundButton()}</div></header><div class="scenes">${s.locations.map(sceneTemplate).join('')}</div><p class="hint">Перетащи предмет или нажми на него</p><div class="tray">${ordered.map(itemTemplate).join('')}</div></main>`;
 app.querySelector('.home').onclick=routeHome;
 app.querySelectorAll('.scene').forEach(el=>el.addEventListener('click',()=>{if(selected){const item=currentSet.items.find(i=>i.id===selected);if(item)attempt(item,el.dataset.loc);}}));
 app.querySelectorAll('.item').forEach(el=>{el.addEventListener('pointerdown',onPointerDown);el.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();pickItem(el.dataset.item)}})});
 setupSound();}
function updateHint(){let h=app.querySelector('.hint');if(h)h.textContent=selected?'Теперь нажми на нужную локацию':placed.size===currentSet.items.length?'Молодец!':'Перетащи предмет или нажми на него';app.querySelectorAll('.item').forEach(el=>{const sel=el.dataset.item===selected;el.classList.toggle('is-selected',sel);el.setAttribute('aria-pressed',String(sel))});app.querySelectorAll('.scene').forEach(el=>el.classList.toggle('selected-target',!!selected))}
function pickItem(id){if(busy.has(id)||placed.has(id))return;sound('pop');selected=selected===id?null:id;updateHint()}
function locate(x,y){if(x==null||y==null)return null;let el=document.elementFromPoint(x,y)?.closest('[data-loc]');if(el)return el.dataset.loc;for(const scene of document.querySelectorAll('[data-loc]')){const r=scene.getBoundingClientRect();if(x>=r.left-12&&x<=r.right+12&&y>=r.top-12&&y<=r.bottom+12)return scene.dataset.loc}return null}
function cleanupDrag(){if(!drag)return;drag.ghost?.remove();drag=null;document.querySelectorAll('.scene').forEach(el=>el.classList.remove('highlight'))}
function onPointerDown(e){if(e.button!==0||drag)return;const el=e.currentTarget,id=el.dataset.item;if(busy.has(id)||placed.has(id))return;unlockSound();const img=el.querySelector('img'),r=img.getBoundingClientRect();drag={id,startX:e.clientX,startY:e.clientY,x:e.clientX,y:e.clientY,offsetX:e.clientX-r.left,offsetY:e.clientY-r.top,w:r.width,moved:false,pointerId:e.pointerId,ghost:null};try{el.setPointerCapture(e.pointerId)}catch{}}
function onMove(e){if(!drag||e.pointerId!==drag.pointerId)return;drag.x=e.clientX;drag.y=e.clientY;let moved=drag.moved||Math.hypot(e.clientX-drag.startX,e.clientY-drag.startY)>8;if(!moved)return;
 if(!drag.moved){drag.moved=true;selected=null;updateHint();sound('pop');const g=new Image();g.src=currentSet.items.find(i=>i.id===drag.id).image;g.className='drag-ghost';g.style.width=drag.w+'px';g.style.height=drag.w+'px';document.body.appendChild(g);drag.ghost=g;app.querySelector(`[data-item="${CSS.escape(drag.id)}"]`)?.classList.add('is-hidden')}
 drag.ghost.style.left=(e.clientX-drag.offsetX)+'px';drag.ghost.style.top=(e.clientY-drag.offsetY)+'px';const loc=locate(e.clientX,e.clientY);document.querySelectorAll('.scene').forEach(el=>el.classList.toggle('highlight',el.dataset.loc===loc));e.preventDefault()}
function onUp(e){if(!drag||e.pointerId!==drag.pointerId)return;endDrag(e.clientX,e.clientY,false)}
function onCancel(e){if(!drag||e.pointerId!==drag.pointerId)return;endDrag(drag.x,drag.y,!drag.moved)}
function endDrag(x,y,cancelled){if(!drag)return;const d=drag;const moved=d.moved;cleanupDrag();if(!moved){if(!cancelled)pickItem(d.id);return}const item=currentSet.items.find(i=>i.id===d.id);if(!item)return;const target=cancelled?null:locate(x,y);attempt(item,target);}
function toast(msg){const el=document.createElement('div');el.className='toast';el.textContent=msg;document.body.appendChild(el);setTimeout(()=>el.remove(),1500)}
function attempt(item,locId){if(placed.has(item.id)||busy.has(item.id))return;const el=app.querySelector(`[data-item="${CSS.escape(item.id)}"]`);if(!el)return;busy.add(item.id);selected=null;updateHint();if(item.locationId!==locId){sound('wrong');toast('Попробуй ещё раз!');el.classList.remove('is-hidden');setTimeout(()=>busy.delete(item.id),350);return}
 sound('correct');const slot=app.querySelector(`[data-slot="${CSS.escape(item.id)}"]`);el.classList.add('is-hidden');const img=el.querySelector('img');const from=img.getBoundingClientRect(),to=slot.getBoundingClientRect();const fly=img.cloneNode(true);fly.className='flight';fly.style.cssText=`left:${from.left}px;top:${from.top}px;width:${from.width}px;height:${from.height}px`;document.body.appendChild(fly);animating++;let finished=false;const finish=()=>{if(finished)return;finished=true;fly.remove();sound('place');placed.add(item.id);busy.delete(item.id);el.remove();const inSlot=document.createElement('img');inSlot.src=item.image;inSlot.alt=item.name;inSlot.className=`placed-pop ${item.ambient==='none'?'':'ambient-'+item.ambient}`;slot.appendChild(inSlot);const check=document.createElement('span');check.className='placed-check';check.textContent='✓';slot.appendChild(check);setTimeout(()=>check.remove(),900);let count=app.querySelector('.count');if(count)count.textContent=placed.size;if(!app.querySelector('.tray .item'))app.querySelector('.tray')?.remove();animating--;updateHint();if(placed.size===currentSet.items.length&&!won){won=true;setTimeout(showWin,550)}};
 try{const dx=to.left-from.left,dy=to.top-from.top,scale=to.width/from.width;const a=fly.animate([{transform:'translate(0,0) scale(1)'},{transform:`translate(${dx*.5}px,${dy*.5-35}px) scale(${(1+scale)/2+.15})`,offset:.5},{transform:`translate(${dx}px,${dy}px) scale(${scale})`}],{duration:550,easing:'cubic-bezier(.4,0,.2,1)',fill:'forwards'});a.onfinish=finish;}catch{finish()}setTimeout(finish,900)}
function showWin(){if(!currentSet||placed.size!==currentSet.items.length)return;sound('win');const done=readDone();if(!done.includes(currentSet.id)){done.push(currentSet.id);try{localStorage.setItem(PROGRESS_KEY,JSON.stringify(done))}catch{}}const win=document.createElement('div');win.className='win-overlay';win.innerHTML='<div class="win-modal"><div class="emoji">🏡</div><h2>Ура! Все нашли свои места! 🎉</h2><p>Ты отлично справился! ⭐</p><button class="candy-btn" type="button">Следующее приключение →</button></div>';for(let i=0;i<64;i++){let a=document.createElement('span');a.className='confetti';a.style.cssText=`left:${Math.random()*100}%;width:${8+Math.random()*12}px;height:${7+Math.random()*8}px;border-radius:${Math.random()>.5?'50%':'2px'};background:${['#e98b32','#f8d45c','#84ca6d','#8dcfe6','#f2a0a6'][i%5]};--dur:${2.5+Math.random()*1.5}s;--delay:${Math.random()*.9}s;--drift:${(Math.random()-.5)*200}px`;win.appendChild(a)}document.body.appendChild(win);win.querySelector('button').onclick=()=>{win.remove();startGame(currentIdx+1)}}
function renderFinish(){app.innerHTML=`<main class="safe-pad finish-screen"><section class="finish-modal"><div style="font-size:72px">🏆</div><h1>Ура! Ты исследовал все волшебные миры! 🏆</h1><button class="candy-btn" type="button">Пройти ещё раз</button><button class="reset" type="button">На главную</button></section></main>`;app.querySelector('.candy-btn').onclick=()=>{localStorage.removeItem(PROGRESS_KEY);startGame(0)};app.querySelector('.reset').onclick=routeHome}
window.addEventListener('pointermove',onMove,{passive:false});window.addEventListener('pointerup',onUp);window.addEventListener('pointercancel',onCancel);window.addEventListener('blur',()=>{if(drag)endDrag(drag.x,drag.y,true)});
try{sets=JSON.parse(document.getElementById('game-data').textContent);routeHome()}catch(e){console.error(e);app.innerHTML='<main class="safe-pad"><h1>Не удалось загрузить уровни</h1></main>'}
})();
</script>
</body>
</html>
