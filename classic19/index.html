<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#131313">
<title>Сказка о маленьком Ёжике — Слушать</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#131313;--accent:#DFCCA4;--muted:#b6b6b6;--line:#3b3b3b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);color-scheme:dark}
body{margin:0;min-height:100dvh;background:var(--bg);color:#fff;font:500 16px/1.5 'Manrope',Arial,sans-serif}
button,input{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
.page{max-width:1130px;margin:0 auto;padding:82px 20px 56px}
header{text-align:center;margin:0 auto 29px}
h1{margin:0;color:var(--accent);font-size:clamp(23px,3.2vw,34px);font-weight:800;line-height:1.3}
.intro{margin:9px 0 0;color:#e0e0e0;font-size:clamp(13px,1.7vw,16px)}
.tracks{display:grid;grid-template-columns:repeat(3,minmax(0,300px));justify-content:center;gap:28px}
.track{min-width:0;text-align:center;display:flex;flex-direction:column;align-items:stretch}
.cover{width:100%;aspect-ratio:1/1;position:relative;overflow:hidden;border-radius:16px;background:#252525}
.cover img{width:100%;height:100%;display:block;object-fit:contain;object-position:center}
.play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:70px;height:70px;display:grid;place-items:center;border:1.5px solid rgba(255,255,255,.8);border-radius:50%;background:rgba(19,19,19,.72);color:#fff;transition:background .18s,color .18s,transform .18s}
.play:hover{background:rgba(19,19,19,.87)}.play:active{transform:translate(-50%,-50%) scale(.95)}
.play svg{width:29px;height:29px;fill:currentColor}
.track.playing .play{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.track.playing .icon-play,.track:not(.playing) .icon-pause{display:none}
.label{font-size:16px;font-weight:800;color:var(--accent);margin:13px 0 0}
.subtitle{font-size:13px;color:var(--muted);margin:2px 0 0;min-height:20px}
.progress{width:100%;margin:18px 0 4px;accent-color:var(--accent);height:24px;cursor:pointer;background:transparent}
.progress:disabled{opacity:.48;cursor:default}
.time{display:flex;justify-content:space-between;color:#bababa;font-variant-numeric:tabular-nums;font-size:12px;letter-spacing:.2px}
.controls{display:flex;gap:24px;align-items:center;justify-content:center;margin-top:13px}
.seek{display:flex;align-items:center;gap:6px;justify-content:center;min-width:92px;padding:6px 8px;border:none;background:transparent;color:#fff;transition:color .15s}
.seek:hover{color:var(--accent)}
.seek svg{height:25px;width:25px;fill:none;stroke:var(--accent);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.seek span{font-size:12px;white-space:nowrap}
.status{margin:6px 0 0;font-size:12px;color:#f2a2a2;min-height:18px}
.info{text-align:center;font-size:12px;color:#999;margin:18px 0 0}
@media(max-width:930px){.tracks{grid-template-columns:repeat(2,minmax(0,290px));gap:30px 22px}}
@media(max-width:640px){.page{padding:82px 18px 34px}header{margin-bottom:22px}.tracks{grid-template-columns:minmax(0,300px);gap:26px}.cover{border-radius:14px}.play{width:68px;height:68px}.label{margin-top:10px}.progress{margin-top:11px}.controls{margin-top:9px}.info{margin-top:20px}}
@media(max-width:360px){.tracks{grid-template-columns:minmax(0,270px)}.page{padding-inline:12px}}
</style>
</head>
<body>
<main class="page">
<header>
<h1>Сказка о маленьком Ёжике</h1>
<p class="intro">Выбери часть и нажми ▶, чтобы послушать историю</p>
</header>
<section class="tracks" id="tracks" aria-label="Три части сказки"></section>
<p class="info">Можно слушать только одну часть за раз</p>
</main>
<script>
'use strict';
const STORIES = [{"title": "Часть 1", "subtitle": "Таинственная тропинка", "cover": "assets/cover-1.webp", "audio": "https://0ea8d161-ec96-420b-b33c-ba41c4a7454e.selstorage.ru/%D0%94%D0%BB%D1%8F%20%D0%B4%D0%B5%D1%82%D0%B5%D0%B9/19%20%D0%9A%D0%BB%D0%B0%D1%81%D1%81%D0%B8%D0%BA%20-%20%D0%A1%D0%BA%D0%B0%D0%B7%D0%BA%D0%B0%20%D0%BE%20%D0%95%CC%88%D0%B6%D0%B8%D0%BA%D0%B5%20%28%D0%A7.1%2C%20%D0%A7.2%2C%20%D0%A7.3%29/%D0%A1%D0%B0%D0%BC%D0%BE%D1%81%D1%82%D0%BE%D1%8F%D1%82%D0%B5%D0%BB%D1%8C%D0%BD%D1%8B%D0%B9%20%D0%B5%D0%B6%D0%B8%D0%BA.%20%D0%A7%D0%B0%D1%81%D1%82%D1%8C%201.mp3"}, {"title": "Часть 2", "subtitle": "Мир полон открытий", "cover": "assets/cover-2.webp", "audio": "https://0ea8d161-ec96-420b-b33c-ba41c4a7454e.selstorage.ru/%D0%94%D0%BB%D1%8F%20%D0%B4%D0%B5%D1%82%D0%B5%D0%B9/19%20%D0%9A%D0%BB%D0%B0%D1%81%D1%81%D0%B8%D0%BA%20-%20%D0%A1%D0%BA%D0%B0%D0%B7%D0%BA%D0%B0%20%D0%BE%20%D0%95%CC%88%D0%B6%D0%B8%D0%BA%D0%B5%20%28%D0%A7.1%2C%20%D0%A7.2%2C%20%D0%A7.3%29/%D0%A1%D0%B0%D0%BC%D0%BE%D1%81%D1%82%D0%BE%D1%8F%D1%82%D0%B5%D0%BB%D1%8C%D0%BD%D1%8B%D0%B9%20%D0%B5%D0%B6%D0%B8%D0%BA.%20%D0%A7%D0%B0%D1%81%D1%82%D1%8C%202.mp3"}, {"title": "Часть 3", "subtitle": "Я могу по-своему", "cover": "assets/cover-3.webp", "audio": "https://0ea8d161-ec96-420b-b33c-ba41c4a7454e.selstorage.ru/%D0%94%D0%BB%D1%8F%20%D0%B4%D0%B5%D1%82%D0%B5%D0%B9/19%20%D0%9A%D0%BB%D0%B0%D1%81%D1%81%D0%B8%D0%BA%20-%20%D0%A1%D0%BA%D0%B0%D0%B7%D0%BA%D0%B0%20%D0%BE%20%D0%95%CC%88%D0%B6%D0%B8%D0%BA%D0%B5%20%28%D0%A7.1%2C%20%D0%A7.2%2C%20%D0%A7.3%29/%D0%A1%D0%B0%D0%BC%D0%BE%D1%81%D1%82%D0%BE%D1%8F%D1%82%D0%B5%D0%BB%D1%8C%D0%BD%D1%8B%D0%B9%20%D0%B5%D0%B6%D0%B8%D0%BA.%20%D0%A7%D0%B0%D1%81%D1%82%D1%8C%203.mp3"}];
const container=document.getElementById('tracks');
const players=[];
let activeAudio=null;
function fmt(t){
  if(!Number.isFinite(t)||t<0)return '0:00';
  const n=Math.floor(t),h=Math.floor(n/3600),m=Math.floor((n%3600)/60),s=n%60;
  return h?`${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`:`${m}:${String(s).padStart(2,'0')}`;
}
const playIcon='<svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>';
const pauseIcon='<svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>';
const backwardIcon='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 1 3 6.2"/><path d="M4 6v6h6"/></svg>';
const forwardIcon='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 0-3 6.2"/><path d="M20 6v6h-6"/></svg>';
STORIES.forEach((story,idx)=>{
 const root=document.createElement('article');root.className='track';
 root.innerHTML=`<div class="cover"><img src="${story.cover}" alt="Обложка: ${story.title}. ${story.subtitle}" ${idx?'loading="lazy"':''}>
 <button class="play" type="button" aria-label="Воспроизвести ${story.title}" aria-pressed="false">${playIcon}${pauseIcon}</button></div>
 <h2 class="label">${story.title}</h2><p class="subtitle">${story.subtitle}</p>
 <input class="progress" type="range" min="0" max="1000" step="1" value="0" disabled aria-label="Перемотка: ${story.title}">
 <div class="time"><span class="current">0:00</span><span class="duration">—:—</span></div>
 <div class="controls"><button type="button" class="seek back" aria-label="Назад на 15 секунд">${backwardIcon}<span>−15 сек</span></button>
 <button type="button" class="seek forward" aria-label="Вперёд на 15 секунд"><span>+15 сек</span>${forwardIcon}</button></div>
 <div class="status" role="status" aria-live="polite"></div>`;
 container.append(root);
 const audio=new Audio(story.audio);audio.preload='metadata';
 const playButton=root.querySelector('.play'),range=root.querySelector('.progress');
 const curr=root.querySelector('.current'),dur=root.querySelector('.duration'),status=root.querySelector('.status');
 players.push(audio);
 const duration=()=>Number.isFinite(audio.duration)&&audio.duration>0?audio.duration:0;
 function update(){
   const d=duration();curr.textContent=fmt(audio.currentTime);
   if(d){dur.textContent=fmt(d);range.disabled=false;range.value=String(Math.min(1000,Math.round(audio.currentTime/d*1000)))}
   else{dur.textContent='—:—';range.disabled=true;range.value='0'}
 }
 function sync(){const playing=!audio.paused&&!audio.ended;root.classList.toggle('playing',playing);playButton.setAttribute('aria-pressed',String(playing));playButton.setAttribute('aria-label',(playing?'Пауза: ':'Воспроизвести: ')+story.title)}
 audio.addEventListener('play',()=>{players.forEach(other=>{if(other!==audio)other.pause()});activeAudio=audio;status.textContent='';sync()});
 audio.addEventListener('pause',sync);
 audio.addEventListener('ended',()=>{if(activeAudio===audio)activeAudio=null;sync()});
 audio.addEventListener('timeupdate',update);
 audio.addEventListener('loadedmetadata',update);
 audio.addEventListener('durationchange',update);
 audio.addEventListener('error',()=>{status.textContent='Не удалось загрузить аудио. Проверь подключение к интернету.';sync()});
 playButton.addEventListener('click',async()=>{
    if(!audio.paused&&!audio.ended){audio.pause();return}
    status.textContent='';if(audio.ended)audio.currentTime=0;
    try{await audio.play()}catch(e){status.textContent='Не удалось запустить аудио. Попробуй ещё раз.';sync()}
 });
 root.querySelector('.back').addEventListener('click',()=>{if(audio.readyState){audio.currentTime=Math.max(0,audio.currentTime-15);update()}});
 root.querySelector('.forward').addEventListener('click',()=>{if(audio.readyState){audio.currentTime=duration()?Math.min(duration(),audio.currentTime+15):audio.currentTime+15;update()}});
 range.addEventListener('input',()=>{const d=duration();if(d){audio.currentTime=d*Number(range.value)/1000;update()}});
 update();sync();
});
document.addEventListener('visibilitychange',()=>{if(document.hidden)players.forEach(a=>a.pause())});
</script>
</body>
</html>
