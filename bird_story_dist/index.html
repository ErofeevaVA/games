<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Птица без стаи — сказка</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --accent:#DFCCA4;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; min-height:100%;
    font-family:'Manrope','Trebuchet MS','Segoe UI',sans-serif;
    background:#131313;
    color:#fff;
  }
  #page{
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:28px 20px 40px;
    text-align:center;
  }
  h1{
    font-size:22px;
    color:var(--accent);
    margin:0 0 30px;
    text-shadow:0 3px 10px rgba(0,0,0,.5);
    max-width:420px;
  }
  .card{
    position:relative;
    width:300px;
    height:300px;
    border-radius:16px;
    overflow:hidden;
    box-shadow:0 8px 22px rgba(0,0,0,.4);
    background:#000;
  }
  .card img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  .playBtn{
    position:absolute;
    top:50%; left:50%;
    transform:translate(-50%,-50%);
    width:72px; height:72px;
    border-radius:50%;
    background:rgba(19,19,19,.55);
    backdrop-filter:blur(2px);
    border:2px solid rgba(255,255,255,.7);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:transform .15s ease, background .15s ease;
  }
  .playBtn:active{ transform:translate(-50%,-50%) scale(0.92); }
  .card.playing .playBtn{
    background:rgba(223,204,164,.85);
    border-color:var(--accent);
  }
  .playBtn svg{
    width:30px; height:30px;
    fill:#fff;
  }
  .card.playing .playBtn svg{
    fill:#131313;
  }
  .icon-pause{ display:none; }
  .card.playing .icon-play{ display:none; }
  .card.playing .icon-pause{ display:block; }

  #controls{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:18px;
    margin-top:22px;
  }
  .seekBtn{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    background:transparent;
    border:none;
    color:#fff;
    cursor:pointer;
    padding:6px;
  }
  .seekBtn:active{ transform:scale(0.92); }
  .seekBtn svg{
    width:34px;
    height:34px;
    fill:none;
    stroke:var(--accent);
    stroke-width:1.6;
  }
  .seekBtn span{
    font-size:12px;
    color:rgba(255,255,255,.75);
  }

  #timeRow{
    margin-top:14px;
    font-size:13px;
    color:rgba(255,255,255,.6);
    min-width:90px;
  }
</style>
</head>
<body>
<div id="page">
  <h1>Нажми на кнопку «воспроизвести» и слушай историю</h1>

  <div class="card" id="storyCard">
    <img src="assets/cover.jpg" alt="Птица без стаи — сказка о поиске своего места и своего неба">
    <div class="playBtn" id="playBtn">
      <svg class="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      <svg class="icon-pause" viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
    </div>
  </div>

  <div id="controls">
    <button class="seekBtn" id="backBtn" aria-label="Назад на 15 секунд">
      <span>-15 сек</span>
      <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 12a8 8 0 1 1 3 6.2"/>
        <path d="M4 6v6h6"/>
      </svg>
    </button>

    <button class="seekBtn" id="fwdBtn" aria-label="Вперёд на 15 секунд">
      <span>+15 сек</span>
      <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round" style="transform:scaleX(-1);">
        <path d="M4 12a8 8 0 1 1 3 6.2"/>
        <path d="M4 6v6h6"/>
      </svg>
    </button>
  </div>

  <div id="timeRow">0:00 / 0:00</div>
</div>

<script>
const AUDIO_URL = 'assets/ptica-bez-stai.mp3';

const card = document.getElementById('storyCard');
const btn = document.getElementById('playBtn');
const backBtn = document.getElementById('backBtn');
const fwdBtn = document.getElementById('fwdBtn');
const timeRow = document.getElementById('timeRow');
const audio = new Audio(AUDIO_URL);
audio.preload = 'metadata';

function formatTime(sec){
  if(!isFinite(sec) || sec < 0) sec = 0;
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return m + ':' + String(s).padStart(2, '0');
}

function updateTimeRow(){
  timeRow.textContent = formatTime(audio.currentTime) + ' / ' + formatTime(audio.duration);
}

btn.addEventListener('click', () => {
  if(card.classList.contains('playing')){
    audio.pause();
    card.classList.remove('playing');
  } else {
    audio.play().catch(() => {});
    card.classList.add('playing');
  }
});

backBtn.addEventListener('click', () => {
  audio.currentTime = Math.max(0, audio.currentTime - 15);
  updateTimeRow();
});

fwdBtn.addEventListener('click', () => {
  const dur = isFinite(audio.duration) ? audio.duration : audio.currentTime + 15;
  audio.currentTime = Math.min(dur, audio.currentTime + 15);
  updateTimeRow();
});

audio.addEventListener('loadedmetadata', updateTimeRow);
audio.addEventListener('timeupdate', updateTimeRow);

audio.addEventListener('ended', () => {
  card.classList.remove('playing');
});
</script>
</body>
</html>
