<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Колыбельные</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --accent:#DFCCA4;
    --bg1:#0f172a;
    --bg2:#1e293b;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; min-height:100%;
    font-family:'Manrope','Trebuchet MS','Segoe UI',sans-serif;
    background:#131313;
    color:#fff;
  }
  #page{
    padding:28px 20px 40px;
    max-width:1000px;
    margin:0 auto;
  }
  h1{
    font-size:22px;
    text-align:center;
    color:var(--accent);
    margin:0 0 30px;
    text-shadow:0 3px 10px rgba(0,0,0,.5);
  }
  #grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, 300px);
    gap:18px;
    justify-content:center;
  }
  .card{
    position:relative;
    width:300px;
    height:300px;
    border-radius:16px;
    overflow:hidden;
    box-shadow:0 8px 22px rgba(0,0,0,.4);
    background:#000;
  }
  .card img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  .playBtn{
    position:absolute;
    top:50%; left:50%;
    transform:translate(-50%,-50%);
    width:64px; height:64px;
    border-radius:50%;
    background:rgba(15,23,42,.55);
    backdrop-filter:blur(2px);
    border:2px solid rgba(255,255,255,.7);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:transform .15s ease, background .15s ease;
  }
  .playBtn:active{ transform:translate(-50%,-50%) scale(0.92); }
  .card.playing .playBtn{
    background:rgba(223,204,164,.85);
    border-color:var(--accent);
  }
  .playBtn svg{
    width:26px; height:26px;
    fill:#fff;
  }
  .card.playing .playBtn svg{
    fill:#131313;
  }
  .icon-pause{ display:none; }
  .card.playing .icon-play{ display:none; }
  .card.playing .icon-pause{ display:block; }
</style>
</head>
<body>
<div id="page">
  <h1>Послушай добрую колыбельную перед сном</h1>
  <div id="grid"></div>
</div>

<script>
const TRACKS = [
  { img: 'assets/1.jpg', audio: 'https://0ea8d161-ec96-420b-b33c-ba41c4a7454e.selstorage.ru/%D0%94%D0%BB%D1%8F%20%D0%B4%D0%B5%D1%82%D0%B5%D0%B9/1%20%D0%A1%D0%BF%D0%B8%2C%20%D0%B4%D0%B8%D1%82%D1%8F%D1%82%D0%BA%D0%BE.mp3' },
  { img: 'assets/2.jpg', audio: 'https://0ea8d161-ec96-420b-b33c-ba41c4a7454e.selstorage.ru/%D0%94%D0%BB%D1%8F%20%D0%B4%D0%B5%D1%82%D0%B5%D0%B9/2%20Ninna%20nanna%20dormi.mp3' },
  { img: 'assets/3.jpg', audio: 'https://0ea8d161-ec96-420b-b33c-ba41c4a7454e.selstorage.ru/%D0%94%D0%BB%D1%8F%20%D0%B4%D0%B5%D1%82%D0%B5%D0%B9/3%20%D0%92%D0%B5%D1%82%D0%B5%D1%80%2C%20%D1%81%D0%BE%D0%BB%D0%BD%D1%86%D0%B5%20%D0%B8%20%D0%BE%D1%80%D0%B5%D0%BB.mp3' },
  { img: 'assets/4.jpg', audio: 'https://0ea8d161-ec96-420b-b33c-ba41c4a7454e.selstorage.ru/%D0%94%D0%BB%D1%8F%20%D0%B4%D0%B5%D1%82%D0%B5%D0%B9/4%20%D0%9C%D0%B0%D0%BC%D0%B8%D0%BD%D1%8B%20%D0%BA%D0%BE%D0%BB%D1%8B%D0%B1%D0%B5%D0%BB%D1%8C%D0%BD%D1%8B%D0%B5%20-%20%D0%93%D0%BB%D0%B0%D0%B6%D1%83%20%D0%B4%D0%B5%D1%82%D0%BE%D1%87%D0%BA%D1%83%20(music7s.com).mp3' },
  { img: 'assets/5.jpg', audio: 'https://0ea8d161-ec96-420b-b33c-ba41c4a7454e.selstorage.ru/%D0%94%D0%BB%D1%8F%20%D0%B4%D0%B5%D1%82%D0%B5%D0%B9/5%20%D0%9A%D0%BE%D0%BB%D1%8B%D0%B1%D0%B5%D0%BB%D1%8C%D0%BD%D1%8B%D0%B5%20%D0%BD%D0%B0%D1%80%D0%BE%D0%B4%D0%BE%D0%B2%20%D0%BC%D0%B8%D1%80%D0%B0%20-%20%D0%A0%D1%83%D1%81%D1%81%D0%BA%D0%B0%D1%8F%20_%D0%A3%D0%B6%20%D0%BA%D0%B0%D0%BA%20%D1%81%D0%BE%D0%BD%20%D1%85%D0%BE%D0%B4%D0%B8%D0%BB%20%D0%BF%D0%BE%20%D0%BB%D0%B0%D0%B2%D0%BA%D0%B5_%20%C2%A9%20vk.com_KIDMUS%20(music7s.com).mp3' },
  { img: 'assets/6.jpg', audio: 'https://0ea8d161-ec96-420b-b33c-ba41c4a7454e.selstorage.ru/%D0%94%D0%BB%D1%8F%20%D0%B4%D0%B5%D1%82%D0%B5%D0%B9/6%20%D0%A0%D1%83%D1%81%D1%81%D0%BA%D0%B8%D0%B5%20%D0%BD%D0%B0%D1%80%D0%BE%D0%B4%D0%BD%D1%8B%D0%B5%20%D0%BA%D0%BE%D0%BB%D1%8B%D0%B1%D0%B5%D0%BB%D1%8C%D0%BD%D1%8B%D0%B5.%20%D0%9E%D0%BB%D1%8C%D0%B3%D0%B0%20%D0%9C%D0%BE%D1%82%D0%BE%D0%B2%D0%B8%D0%BB%D0%BE%D0%B2%D0%B0%20-%204.%20%D0%93%D1%83%D0%BB%D0%B5%D0%BD%D1%8C%D0%BA%D0%B8%20(music7s.com).mp3' },
];

const grid = document.getElementById('grid');
let currentAudio = null;
let currentCard = null;

TRACKS.forEach((track, i) => {
  const card = document.createElement('div');
  card.className = 'card';

  const img = document.createElement('img');
  img.src = track.img;
  img.alt = `Колыбельная ${i + 1}`;
  img.loading = 'lazy';

  const btn = document.createElement('div');
  btn.className = 'playBtn';
  btn.innerHTML = `
    <svg class="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    <svg class="icon-pause" viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
  `;

  const audio = new Audio(track.audio);
  audio.preload = 'none';

  btn.addEventListener('click', () => togglePlay(card, audio));
  audio.addEventListener('ended', () => stopCard(card));

  card.appendChild(img);
  card.appendChild(btn);
  grid.appendChild(card);
});

function togglePlay(card, audio){
  const isThisPlaying = card.classList.contains('playing');

  // останавливаем предыдущую колыбельную, если играла другая
  if(currentAudio && currentAudio !== audio){
    currentAudio.pause();
    currentAudio.currentTime = 0;
    if(currentCard) currentCard.classList.remove('playing');
  }

  if(isThisPlaying){
    audio.pause();
    card.classList.remove('playing');
    currentAudio = null;
    currentCard = null;
  } else {
    audio.play().catch(() => {});
    card.classList.add('playing');
    currentAudio = audio;
    currentCard = card;
  }
}

function stopCard(card){
  card.classList.remove('playing');
  if(currentCard === card){
    currentAudio = null;
    currentCard = null;
  }
}
</script>
</body>
</html>
