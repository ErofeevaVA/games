<!-- Классик 17. ВСТАВИТЬ В HTML-ЭЛЕМЕНТ ZERO BLOCK попапа №17. -->
<div id="marker-17" style="width:1px;height:1px"></div>
<script>
(function(){
  var marker=document.getElementById('marker-17');
  if(!marker||marker.dataset.embedded==='yes')return;
  marker.dataset.embedded='yes';
  var popup=marker.closest('.t-popup');
  if(!popup)return;
  var overlay=null,iframe=null,closeButton=null,lightboxOpen=false,closing=false,wasOpen=false;
  var savedScroll=window.scrollY||0;
  var preHtmlOverflow=document.documentElement.style.overflow;
  var preBodyOverflow=document.body.style.overflow;
  var htmlOverflow='',bodyOverflow='';
  function isOpen(){return popup.classList.contains('t-popup_show')&&getComputedStyle(popup).display!=='none';}
  function rememberScroll(){if(!isOpen()&&!overlay)savedScroll=window.scrollY||window.pageYOffset||0;}
  window.addEventListener('scroll',rememberScroll,{passive:true});
  function restorePosition(){window.scrollTo(0,savedScroll);}
  function showGame(){
    if(overlay||closing)return;
    htmlOverflow=document.documentElement.style.overflow;
    bodyOverflow=document.body.style.overflow;
    document.documentElement.style.overflow='hidden';
    document.body.style.overflow='hidden';
    overlay=document.createElement('div');
    overlay.id='classic17-fullscreen';
    overlay.style.cssText='position:fixed;inset:0;width:100%;height:100%;height:100dvh;background:#131313;z-index:2147483646;';
    iframe=document.createElement('iframe');
    iframe.src='https://erofeevava.github.io/games/classic17_gallery/index.html';
    iframe.title='Жизненный цикл живой природы';iframe.setAttribute('allow','fullscreen');
    iframe.style.cssText='position:absolute;inset:0;width:100%;height:100%;border:0;';
    closeButton=document.createElement('button');closeButton.type='button';closeButton.textContent='×';
    closeButton.setAttribute('aria-label','Закрыть классик 17');
    closeButton.style.cssText='position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:calc(16px + env(safe-area-inset-right,0px));width:46px;height:46px;border:0;border-radius:50%;background:#262626;color:#fff;font-size:30px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:2;';
    closeButton.addEventListener('click',closeEverything);
    overlay.append(iframe,closeButton);document.body.append(overlay);
  }
  function hideGame(){
    if(!overlay)return;
    overlay.remove();overlay=null;iframe=null;closeButton=null;lightboxOpen=false;
    document.documentElement.style.overflow=htmlOverflow;
    document.body.style.overflow=bodyOverflow;
  }
  function closeEverything(){
    if(closing)return;closing=true;hideGame();
    var btn=popup.querySelector('.t-popup__close-wrapper, .t-popup__close');
    if(btn)btn.click();
    requestAnimationFrame(restorePosition);
    [90,260,600].forEach(function(ms){setTimeout(restorePosition,ms)});
    setTimeout(function(){
      if(!isOpen()){
        document.documentElement.style.overflow=preHtmlOverflow;
        document.body.style.overflow=preBodyOverflow;
      }
      closing=false;wasOpen=isOpen();restorePosition();
    },750);
  }
  window.addEventListener('message',function(event){
    if(!iframe||event.source!==iframe.contentWindow||event.origin!=='https://erofeevava.github.io')return;
    if(!event.data||event.data.type!=='classic17:lightbox')return;
    lightboxOpen=event.data.open===true;
    if(closeButton)closeButton.style.display=lightboxOpen?'none':'flex';
  });
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape'&&overlay&&!lightboxOpen){closeEverything();}
  });
  setInterval(function(){
    if(closing)return;
    var open=isOpen();
    if(open&&!wasOpen)showGame();
    if(!open&&wasOpen){hideGame();requestAnimationFrame(restorePosition);}
    wasOpen=open;
  },250);
})();
</script>
