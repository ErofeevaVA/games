<!-- Классик 17: вставить вместо СТАРОГО кода в HTML-элементе Zero Block попапа №17 -->
<div id="marker-17" style="width:1px;height:1px"></div>
<script>
(function(){
  var marker=document.getElementById('marker-17');
  if(!marker || marker.dataset.classic17Ready==='1') return;
  marker.dataset.classic17Ready='1';
  var popupEl=marker.closest('.t-popup');
  if(!popupEl) return;
  var overlay=null, iframe=null, closeBtn=null;
  var wasVisible=false, closing=false, lightboxOpen=false;
  var savedScrollY=0, savedHtmlOverflow='', savedBodyOverflow='';

  function isPopupOpen(){
    return popupEl.classList.contains('t-popup_show') &&
      window.getComputedStyle(popupEl).display!=='none';
  }
  // Запоминаем позицию ещё до перехода в модальный режим.
  function rememberScroll(){
    if(!overlay && !isPopupOpen()) savedScrollY=window.scrollY || window.pageYOffset || 0;
  }
  rememberScroll();
  window.addEventListener('scroll',rememberScroll,{passive:true});
  function restoreScroll(){ window.scrollTo(0,savedScrollY); }

  function showGame(){
    if(overlay || closing) return;
    savedHtmlOverflow=document.documentElement.style.overflow;
    savedBodyOverflow=document.body.style.overflow;
    document.documentElement.style.overflow='hidden';
    document.body.style.overflow='hidden';
    overlay=document.createElement('div');
    overlay.id='game-wrap-17';
    overlay.style.cssText='position:fixed;inset:0;width:100%;height:100%;height:100dvh;z-index:2147483646;background:#131313;';
    iframe=document.createElement('iframe');
    iframe.src='https://erofeevava.github.io/games/classic17/index.html?v=2';
    iframe.title='Жизненный цикл живой природы';
    iframe.allowFullscreen=true;
    iframe.style.cssText='position:absolute;inset:0;width:100%;height:100%;border:0;';
    closeBtn=document.createElement('button');
    closeBtn.type='button';
    closeBtn.textContent='×';
    closeBtn.setAttribute('aria-label','Закрыть классик 17');
    closeBtn.style.cssText='position:absolute;top:calc(16px + env(safe-area-inset-top,0px));right:calc(20px + env(safe-area-inset-right,0px));z-index:2;width:46px;height:46px;border:0;border-radius:50%;background:#2d2d2d;color:white;font-size:29px;display:flex;align-items:center;justify-content:center;cursor:pointer;';
    closeBtn.addEventListener('click',closeEverything);
    overlay.appendChild(iframe);
    overlay.appendChild(closeBtn);
    document.body.appendChild(overlay);
    lightboxOpen=false;
  }
  function hideGame(){
    if(!overlay) return;
    overlay.remove();overlay=null;iframe=null;closeBtn=null;lightboxOpen=false;
    document.documentElement.style.overflow=savedHtmlOverflow;
    document.body.style.overflow=savedBodyOverflow;
    restoreScroll();
  }
  function closeEverything(){
    if(closing)return;
    closing=true;
    hideGame();
    var popupClose=popupEl.querySelector('.t-popup__close-wrapper, .t-popup__close');
    if(popupClose)popupClose.click();
    requestAnimationFrame(restoreScroll);
    [100,350,650].forEach(function(ms){setTimeout(restoreScroll,ms)});
    setTimeout(function(){closing=false;wasVisible=isPopupOpen();},800);
  }
  // Сообщение от iframe: показывать только ОДИН крестик.
  window.addEventListener('message',function(e){
    if(!iframe || e.source!==iframe.contentWindow ||
       e.origin!=='https://erofeevava.github.io' ||
       !e.data || e.data.type!=='classic17:lightbox') return;
    lightboxOpen=e.data.open===true;
    if(closeBtn)closeBtn.style.display=lightboxOpen?'none':'flex';
  });
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape' && overlay && !lightboxOpen) closeEverything();
  });
  setInterval(function(){
    if(closing)return;
    var visible=isPopupOpen();
    if(visible && !wasVisible)showGame();
    else if(!visible && wasVisible)hideGame();
    wasVisible=visible;
  },250);
})();
</script>
