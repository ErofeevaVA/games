<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Тайное слово — классик 18</title><style>
@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap');
:root{--bg:#131313;--card:#242424;--accent:#DFCCA4;--line:#424242}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Manrope,Arial,sans-serif}main{max-width:1000px;margin:auto;padding:72px 16px 28px}h1{font-size:clamp(26px,4vw,43px);color:var(--accent);text-align:center;margin:0 0 9px}p.sub{text-align:center;color:#e0e0e0;margin:0 0 25px;font-size:15px}.section-label{margin:21px 0 11px;text-align:center;font-weight:800;color:var(--accent)}button{font:inherit;cursor:pointer;touch-action:manipulation}.difficulties{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.btn{border:1px solid #555;background:#242424;color:#fff;padding:10px 19px;border-radius:12px;font-weight:700}.btn.active,.btn.primary{background:var(--accent);border-color:var(--accent);color:#131313}.cats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.cat{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;min-height:130px;border:1px solid #444;border-radius:16px;background:#242424;color:#fff;font-weight:700;padding:10px}.cat .emoji{font-size:39px}.cat:active,.btn:active{transform:scale(.98)}.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:15px}.top .btn{font-size:13px;padding:9px 12px}.pill{background:#242424;padding:9px 12px;border-radius:14px;font-weight:700;font-size:13px}.mystery{width:min(240px,46vw);height:130px;background:#242424;border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;margin:15px auto;color:var(--accent);font-weight:800}.question{font-size:63px;line-height:1}.hint{text-align:center;margin:12px}.word{display:flex;flex-wrap:wrap;justify-content:center;gap:5px;margin:25px 0}.letter{width:clamp(25px,6vw,45px);height:clamp(36px,7vw,53px);border-bottom:3px solid var(--accent);display:grid;place-items:center;font-size:clamp(18px,4vw,26px);font-weight:800}.keyboard{display:flex;flex-wrap:wrap;gap:7px;max-width:680px;margin:0 auto;justify-content:center}.key{min-width:clamp(32px,7vw,47px);height:45px;border-radius:10px;background:#333;color:#fff;border:1px solid #666;font-size:18px;font-weight:800}.key.correct{background:#395c43;border-color:#5b9c73}.key.wrong{background:#473030;border-color:#6b4949;opacity:.5}.key:disabled{cursor:default}.win{position:fixed;inset:0;z-index:20;background:#000d;display:flex;align-items:center;justify-content:center;padding:18px;overflow-y:auto}.win-card{max-width:430px;width:100%;background:#252525;border:1px solid var(--accent);padding:22px;border-radius:20px;text-align:center}.win-card h2{color:var(--accent);margin:0}.win img{display:block;object-fit:contain;max-width:100%;width:min(280px,65vw);height:min(280px,36dvh);margin:12px auto;border-radius:12px}.win .btn{display:block;width:100%;margin-top:10px}.word-name{font-size:22px;color:var(--accent);font-weight:800}.muted{font-size:12px;color:#a5a5a5;text-align:center;margin-top:22px}
@media(max-width:650px){main{padding:76px 10px 25px}.cats{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.cat{min-height:105px}.cat .emoji{font-size:32px}.top{gap:4px}.pill{font-size:11px;padding:8px}.mystery{height:100px}.question{font-size:48px}.keyboard{gap:4px}.key{height:42px;font-size:16px}.word{margin:17px 0}}
</style></head><body><main id="app"></main><script>
let categories=[],difficulty='easy',phase='menu',category=null,entry=null,queues={},guessed=new Set(),wrong=new Set(),hinted=new Set(),hints=2,progress={n:0,total:0};const $=id=>document.getElementById(id),norm=c=>c==='Ё'?'Е':c,rand=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a},alphabet='ЙЦУКЕНГШЩЗХЪФЫВАПРОЛДЖЭЯЧСМИТЬБЮ'.split('');
function menu(){phase='menu';$('app').innerHTML=`<h1>Тайное слово</h1><p class="sub">Угадывай буквы — открывай тайную картинку ✨</p><div class="section-label">Сложность</div><div class="difficulties">${[['easy','Легко'],['medium','Средне'],['hard','Сложно']].map(([d,t])=>`<button class="btn ${difficulty===d?'active':''}" data-difficulty="${d}">${t}</button>`).join('')}</div><div class="section-label">Выбери категорию</div><div class="cats">${categories.map(c=>`<button class="cat" data-cat="${c.id}"><span class="emoji">${c.emoji}</span>${c.name}</button>`).join('')}</div><div class="muted">8 категорий · 3 уровня сложности · для детей</div>`;document.querySelectorAll('[data-difficulty]').forEach(b=>b.onclick=()=>{difficulty=b.dataset.difficulty;menu()});document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>start(categories.find(c=>c.id===b.dataset.cat)))}
function start(cat){category=cat;let k=cat.id+':'+difficulty,q=queues[k];if(!q||q.pos>=q.words.length){let a=rand(cat.levels[difficulty]);if(q&&a.length>1&&a[0].word===q.words.at(-1).word)a.push(a.shift());q={words:a,pos:0};queues[k]=q}entry=q.words[q.pos++];progress={n:q.pos,total:q.words.length};guessed=new Set();wrong=new Set();hinted=new Set();hints=difficulty==='easy'?2:1;phase='playing';render()}
function render(){if(!entry)return;let letters=entry.word.split(''),done=phase==='won';$('app').innerHTML=`<div class="top"><button class="btn" id="menu">← Меню</button><span class="pill">${category.emoji} ${category.name}</span><span class="pill">${progress.n} / ${progress.total}</span></div><div class="mystery"><span class="question">?</span><span>${letters.length} букв</span></div><div class="hint"><button class="btn" id="hint" ${hints===0||done?'disabled':''}>💡 Подсказка · Осталось: ${hints}</button></div><div class="word">${letters.map((c,i)=>`<div class="letter">${guessed.has(norm(c))||hinted.has(i)||done?c:''}</div>`).join('')}</div><div class="keyboard">${alphabet.map(c=>`<button class="key ${guessed.has(c)?'correct':wrong.has(c)?'wrong':''}" data-letter="${c}" ${guessed.has(c)||wrong.has(c)||done?'disabled':''}>${c}</button>`).join('')}</div>`;$('menu').onclick=menu;$('hint').onclick=useHint;document.querySelectorAll('[data-letter]').forEach(b=>b.onclick=()=>guess(b.dataset.letter));if(done)win()}
function checkWin(){return entry.word.split('').every((c,i)=>guessed.has(norm(c))||hinted.has(i))}
function guess(c){if(phase!=='playing'||guessed.has(c)||wrong.has(c))return;if(entry.word.split('').map(norm).includes(c))guessed.add(c);else wrong.add(c);if(checkWin()){phase='won'}render()}
function useHint(){if(phase!=='playing'||hints<=0)return;const hidden=entry.word.split('').map((c,i)=>(guessed.has(norm(c))||hinted.has(i))?null:i).filter(i=>i!==null);if(!hidden.length)return;hinted.add(hidden[Math.floor(Math.random()*hidden.length)]);hints--;if(checkWin())phase='won';render()}
function win(){const d=document.createElement('div');d.className='win';let safe=entry.word.replace(/[<>&"']/g,'');d.innerHTML=`<div class="win-card"><h2>Правильно! 🎉</h2><p>Молодец! Ты угадал слово!</p>${entry.image?`<img src="${entry.image}" alt="${safe}">`:'<div style="font-size:80px;padding:20px">🌟</div>'}<div class="word-name">${safe}</div><button class="btn primary" id="next">Следующее слово →</button><button class="btn" id="other">Выбрать другую категорию</button></div>`;document.body.append(d);$('next').onclick=()=>{d.remove();start(category)};$('other').onclick=()=>{d.remove();menu()}}
window.addEventListener('keydown',e=>{if(phase==='playing'&&e.key.length===1&&/[А-ЯЁа-яё]/.test(e.key))guess(norm(e.key.toUpperCase()))});fetch('data.json').then(r=>{if(!r.ok)throw Error();return r.json()}).then(a=>{categories=a;menu()}).catch(()=>$('app').innerHTML='<h1>Не удалось загрузить игру</h1><p class="sub">Проверьте файл data.json.</p>');
</script></body></html>
