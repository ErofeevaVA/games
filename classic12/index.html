<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Всё по местам</title><style>
@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap');
*{box-sizing:border-box}body{margin:0;background:#131313;color:#fff;font-family:Manrope,Arial,sans-serif}button{font:inherit;cursor:pointer}main{max-width:1150px;margin:auto;padding:65px 12px 24px;text-align:center}h1{color:#dfcca4;font-size:clamp(23px,4vw,38px);margin:0 0 9px}.sub{font-size:clamp(12px,2vw,17px);margin:0 0 18px}.scenes{display:grid;grid-template-columns:1fr 1fr;gap:12px}.scene-card{border:1px solid #3b3b3b;border-radius:17px;padding:8px;background:#202020;min-width:0}.scene-card h2{font-size:clamp(15px,2vw,22px);margin:0 0 8px}.scene{position:relative;aspect-ratio:16/10;overflow:hidden;border-radius:12px;background:#333}.scene>img.bg{width:100%;height:100%;object-fit:cover}.placed{position:absolute;transform:translate(-50%,-50%);object-fit:contain;filter:drop-shadow(0 2px 3px #0007);pointer-events:none}.tray-title{font-weight:800;font-size:20px;margin:16px 0 9px}.tray{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;padding:10px;border:1px solid #444;border-radius:17px;background:#202020}.item{border:1px solid #353535;border-radius:12px;aspect-ratio:1.3;display:flex;align-items:center;justify-content:center;touch-action:none;user-select:none;min-width:0;min-height:0}.item img{width:100%;height:100%;object-fit:contain;pointer-events:none}.item:active{border-color:#dfcca4}.item.done{opacity:.18;pointer-events:none}.actions{margin-top:14px}.btn{border:0;background:#dfcca4;color:#131313;font-weight:800;border-radius:30px;padding:12px 30px}.btn:disabled{background:#555;color:#999;cursor:default}.hint{font-size:13px;color:#bbb;margin-top:10px}.overlay{position:fixed;inset:0;background:#000b;display:grid;place-items:center;z-index:20;padding:18px}.modal{background:#252525;border:1px solid #dfcca4;border-radius:22px;padding:28px;max-width:420px;text-align:center}.modal h2{color:#dfcca4}.ghost{position:fixed;z-index:40;pointer-events:none;object-fit:contain;filter:drop-shadow(0 4px 8px #0009)}.home-hero{width:min(700px,100%);border-radius:22px;margin:12px auto 20px;display:block}.home-actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.small{font-size:13px;color:#aaa;margin-top:12px}
@media(max-width:760px){main{padding:72px 8px 12px}.sub{margin-bottom:10px}.scenes{gap:6px}.scene-card{padding:4px;border-radius:12px}.scene-card h2{margin-bottom:4px;font-size:14px}.scene{aspect-ratio:16/9}.tray-title{font-size:16px;margin:9px 0 5px}.tray{gap:3px;padding:5px}.item{aspect-ratio:auto;height:clamp(58px,10dvh,82px);border-radius:7px}.btn{padding:10px 25px}.hint{font-size:11px}}
</style></head><body><main id="app"></main><script>
let sets=[],level=0,placed={},drag=null;
const app=document.getElementById('app'),key='classic12-lovable-completed';
const shuffle=a=>[...a].sort(()=>Math.random()-.5);
const completed=()=>JSON.parse(localStorage.getItem(key)||'[]');
function home(){let done=completed();app.innerHTML=`<h1>Всё по местам 🏡</h1><p class="sub">Помоги каждому предмету найти своё место!</p><img class="home-hero" src="assets/hero.webp" alt=""><div class="home-actions"><button class="btn" id="start">Играть</button>${done.length?'<button class="btn" id="reset">Начать заново</button>':''}</div><div class="small">${done.length} из ${sets.length} приключений</div>`;document.getElementById('start').onclick=()=>start(Math.max(0,sets.findIndex(s=>!done.includes(s.id))));let b=document.getElementById('reset');if(b)b.onclick=()=>{localStorage.removeItem(key);home()}}
function start(i){level=i;placed={};render()}
function render(){const s=sets[level];if(!s){app.innerHTML='<h1>Ура! Все миры пройдены! 🏆</h1><button class="btn" id="again">Пройти ещё раз</button>';document.getElementById('again').onclick=()=>{localStorage.removeItem(key);start(0)};return}
app.innerHTML=`<h1>Уровень ${level+1}</h1><p class="sub">Перетащи каждый предмет к месту, где он встречается</p><div class="scenes">${s.locations.map(l=>`<section class="scene-card"><h2>${l.name.toUpperCase()}</h2><div class="scene" data-location="${l.id}"><img class="bg" src="${l.image}" alt="${l.name}"></div></section>`).join('')}</div><div class="tray-title">Предметы</div><div class="tray">${shuffle(s.items).map(it=>`<div class="item" data-id="${it.id}" title="${it.name}"><img src="${it.image}" alt="${it.name}"></div>`).join('')}</div><div class="actions"><button class="btn" id="done" disabled>ГОТОВО!</button></div><div class="hint">Перетащи предмет на подходящую картинку или нажми на предмет, затем на картинку</div>`;
document.querySelectorAll('.item').forEach(el=>{el.addEventListener('pointerdown',down);el.addEventListener('click',()=>{if(!placed[el.dataset.id]){selected=el.dataset.id;document.querySelectorAll('.item').forEach(e=>e.style.borderColor=e===el?'#dfcca4':'')}})});
document.querySelectorAll('.scene').forEach(el=>el.addEventListener('click',()=>{if(selected){drop(selected,el.dataset.location);selected=null}}));
document.getElementById('done').onclick=finish}
let selected=null;
function down(e){if(e.button!==0&&e.pointerType==='mouse')return;const el=e.currentTarget;if(placed[el.dataset.id])return;const r=el.getBoundingClientRect(),im=el.querySelector('img');drag={id:el.dataset.id,startX:e.clientX,startY:e.clientY,moved:false,ghost:document.createElement('img')};drag.ghost.src=im.src;drag.ghost.className='ghost';drag.ghost.style.cssText=`left:${r.left}px;top:${r.top}px;width:${r.width}px;height:${r.height}px;opacity:0`;document.body.append(drag.ghost);window.addEventListener('pointermove',move);window.addEventListener('pointerup',up);window.addEventListener('pointercancel',cancel)}
function move(e){if(!drag)return;if(Math.hypot(e.clientX-drag.startX,e.clientY-drag.startY)>7)drag.moved=true;if(drag.moved){drag.ghost.style.opacity='1';drag.ghost.style.left=(e.clientX-drag.ghost.width/2)+'px';drag.ghost.style.top=(e.clientY-drag.ghost.height/2)+'px';e.preventDefault()}}
function up(e){if(!drag)return;let d=drag,was=d.moved;cancel();if(!was)return;let el=document.elementFromPoint(e.clientX,e.clientY)?.closest('.scene');if(el)drop(d.id,el.dataset.location)}
function cancel(){if(drag){drag.ghost.remove();drag=null}window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up);window.removeEventListener('pointercancel',cancel)}
function drop(id,location){const s=sets[level],it=s.items.find(x=>x.id===id);if(!it||placed[id])return;if(it.locationId!==location){let el=document.querySelector(`.item[data-id="${id}"]`);if(el){el.style.borderColor='#e77';setTimeout(()=>el.style.borderColor='',400)}return}
placed[id]=true;const scene=[...document.querySelectorAll('.scene')].find(e=>e.dataset.location===location);const img=document.createElement('img');img.src=it.image;img.alt=it.name;img.className='placed';img.style.cssText=`left:${it.slot.x}%;top:${it.slot.y}%;width:${it.slot.size}%;height:${it.slot.size*1.3}%`;scene.append(img);document.querySelectorAll('.item').forEach(e=>{if(e.dataset.id===id)e.classList.add('done')});document.getElementById('done').disabled=Object.keys(placed).length!==s.items.length}
function finish(){if(Object.keys(placed).length!==sets[level].items.length)return;const ids=completed();if(!ids.includes(sets[level].id)){ids.push(sets[level].id);localStorage.setItem(key,JSON.stringify(ids))}const last=level===sets.length-1;const overlay=document.createElement('div');overlay.className='overlay';overlay.innerHTML=`<div class="modal"><h2>${last?'Молодец! Все задания выполнены верно!':'МОЛОДЕЦ! 🎉'}</h2><p>Все предметы на своих местах!</p><button class="btn">${last?'Играть заново':'Играть дальше'}</button></div>`;document.body.append(overlay);overlay.querySelector('button').onclick=()=>{overlay.remove();if(last){localStorage.removeItem(key);start(0)}else start(level+1)}}
window.addEventListener('blur',cancel);fetch('sets.json').then(r=>r.json()).then(d=>{sets=d;home()}).catch(()=>{app.textContent='Не удалось загрузить уровни игры.'});
</script></body></html>
